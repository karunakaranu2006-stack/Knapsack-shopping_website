<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Product - Knapsack Admin</title>
  <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>

  <!-- Navbar -->
  <div th:replace="~{fragments/navbar :: navbar}"></div>

  <div class="container" style="padding-top: 3rem; padding-bottom: 5rem; max-width: 800px;">
    <div style="margin-bottom: 2rem;">
      <a th:href="@{/admin}" style="color: var(--color-slate-500); font-weight: 600;"><i class="fa-solid fa-arrow-left"></i> Back to Dashboard</a>
      <h1 style="font-size: 2.25rem; font-weight: 800; margin-top: 0.5rem;" th:text="${product.productId == null ? 'Create New Product' : 'Edit Product'}">Manage Product</h1>
    </div>

    <div style="background-color: white; border-radius: var(--radius-2xl); padding: 2.5rem; border: 1px solid var(--color-slate-200); box-shadow: var(--shadow-sm);">
      <form th:action="@{/admin/products/save}" th:object="${product}" method="post">
        <input type="hidden" th:field="*{productId}">

        <div class="form-group">
          <label class="form-label">Product Name *</label>
          <input type="text" th:field="*{name}" required placeholder="Nomad Pro Tactical Backpack 35L" class="form-input">
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem;">
          <div class="form-group">
            <label class="form-label">Category *</label>
            <select name="categoryId" required class="form-input">
              <option value="">-- Select Category --</option>
              <option th:each="cat : ${categories}" 
                      th:value="${cat.categoryId}" 
                      th:text="${cat.name}"
                      th:selected="${product.category != null and product.category.categoryId == cat.categoryId}">Category</option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label">Stock Quantity *</label>
            <input type="number" th:field="*{stockQuantity}" required min="0" class="form-input">
          </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem;">
          <div class="form-group">
            <label class="form-label">Regular Price (₹) *</label>
            <input type="number" step="0.01" th:field="*{price}" required placeholder="9999.00" class="form-input">
          </div>

          <div class="form-group">
            <label class="form-label">Discount Price (₹) (Optional)</label>
            <input type="number" step="0.01" th:field="*{discountPrice}" placeholder="7999.00" class="form-input">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Image URL *</label>
          <input type="url" th:field="*{imageUrl}" required placeholder="https://images.unsplash.com/photo-..." class="form-input">
        </div>

        <div class="form-group">
          <label class="form-label">Product Description</label>
          <textarea th:field="*{description}" rows="4" class="form-input" placeholder="Full details, materials, specs..."></textarea>
        </div>

        <div class="form-group" style="display: flex; align-items: center; gap: 0.5rem; margin-top: 1rem;">
          <input type="checkbox" th:field="*{isFeatured}" id="isFeatured" style="width: 1.2rem; height: 1.2rem; cursor: pointer;">
          <label for="isFeatured" style="font-weight: 600; cursor: pointer;">Feature on Home Page</label>
        </div>

        <div style="display: flex; gap: 1rem; margin-top: 2rem;">
          <button type="submit" class="btn btn-primary btn-lg" style="flex: 1;">Save Product</button>
          <a th:href="@{/admin}" class="btn btn-outline btn-lg">Cancel</a>
        </div>
      </form>
    </div>
  </div>

  <!-- Footer -->
  <div th:replace="~{fragments/footer :: footer}"></div>

  <script th:src="@{/js/main.js}"></script>
</body>
</html>
