<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us - Knapsack</title>
  <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>

  <!-- Navbar -->
  <div th:replace="~{fragments/navbar :: navbar}"></div>

  <div class="container" style="padding-top: 4rem; padding-bottom: 5rem; max-width: 800px;">
    <div style="text-align: center; margin-bottom: 3rem;">
      <h1 style="font-size: 2.5rem; font-weight: 800;">Get In Touch</h1>
      <p style="color: var(--color-slate-500); font-size: 1.1rem; margin-top: 0.5rem;">Have a question about an order or gear specifications? We're here to help.</p>
    </div>

    <div style="background-color: white; border-radius: var(--radius-2xl); padding: 3rem; border: 1px solid var(--color-slate-200); box-shadow: var(--shadow-sm);">
      <form onsubmit="event.preventDefault(); alert('Thank you! Your message has been sent.');">
        <div class="form-group">
          <label class="form-label">Your Name</label>
          <input type="text" required placeholder="John Doe" class="form-input">
        </div>
        <div class="form-group">
          <label class="form-label">Email Address</label>
          <input type="email" required placeholder="you@example.com" class="form-input">
        </div>
        <div class="form-group">
          <label class="form-label">Subject</label>
          <input type="text" required placeholder="Order Inquiry / Product Spec" class="form-input">
        </div>
        <div class="form-group">
          <label class="form-label">Message</label>
          <textarea rows="5" required placeholder="How can we help you today?" class="form-input" style="resize: vertical;"></textarea>
        </div>
        <button type="submit" class="btn btn-primary btn-lg" style="width: 100%; margin-top: 1rem;">
          Send Message
        </button>
      </form>
    </div>
  </div>

  <!-- Footer -->
  <div th:replace="~{fragments/footer :: footer}"></div>

  <script th:src="@{/js/main.js}"></script>
</body>
</html>
