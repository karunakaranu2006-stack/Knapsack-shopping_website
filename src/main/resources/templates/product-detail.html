<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="${product.name} + ' - Knapsack'">Product Detail - Knapsack</title>
  <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>

  <!-- Navbar -->
  <div th:replace="~{fragments/navbar :: navbar}"></div>

  <div class="container" style="padding-top: 3rem; padding-bottom: 4rem;">
    <!-- Breadcrumbs -->
    <div style="font-size: 0.9rem; color: var(--color-slate-500); margin-bottom: 2rem;">
      <a th:href="@{/}" style="color: var(--color-slate-500);">Home</a> / 
      <a th:href="@{/products}" style="color: var(--color-slate-500);">Products</a> / 
      <span th:text="${product.name}" style="color: var(--color-slate-900); font-weight: 600;">Product Name</span>
    </div>

    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 3.5rem; align-items: start;">
      <!-- Product Image -->
      <div style="background-color: white; border-radius: var(--radius-2xl); padding: 1.5rem; border: 1px solid var(--color-slate-200); box-shadow: var(--shadow-sm);">
        <img id="mainProductImage" th:src="${product.imageUrl}" th:alt="${product.name}" style="width: 100%; border-radius: var(--radius-xl); object-fit: cover;">
      </div>

      <!-- Details Column -->
      <div>
        <div class="product-category" th:text="${product.category != null ? product.category.name : 'GEAR'}">Category</div>
        <h1 style="font-size: 2.5rem; font-weight: 800; margin-bottom: 1rem;" th:text="${product.name}">Product Title</h1>

        <div style="display: flex; align-items: center; gap: 1rem; margin-bottom: 1.5rem;">
          <div class="rating-stars" style="font-size: 1.1rem;">
            <i class="fa-solid fa-star"></i>
            <i class="fa-solid fa-star"></i>
            <i class="fa-solid fa-star"></i>
            <i class="fa-solid fa-star"></i>
            <i class="fa-solid fa-star-half-stroke"></i>
            <span class="rating-count" th:text="'(' + ${product.reviewCount} + ' Verified Customer Reviews)'">(12)</span>
          </div>
          <span th:if="${product.stockQuantity > 0}" style="background-color: #d1fae5; color: #059669; font-weight: 700; font-size: 0.8rem; padding: 0.25rem 0.75rem; border-radius: var(--radius-full);">
            IN STOCK (<span th:text="${product.stockQuantity}">10</span> left)
          </span>
        </div>

        <div style="display: flex; align-items: baseline; gap: 1rem; margin-bottom: 1.5rem;">
          <span style="font-size: 2.5rem; font-weight: 800; color: var(--color-slate-900);" th:text="'$' + ${#numbers.formatDecimal(product.effectivePrice, 1, 2)}">$99.99</span>
          <span th:if="${product.discountPrice != null and product.discountPrice < product.price}" style="font-size: 1.25rem; color: var(--color-slate-400); text-decoration: line-through;" th:text="'$' + ${#numbers.formatDecimal(product.price, 1, 2)}">$129.99</span>
          <span th:if="${product.discountPercentage > 0}" style="background-color: var(--color-secondary); color: white; font-weight: 700; font-size: 0.85rem; padding: 0.2rem 0.5rem; border-radius: var(--radius-md);" th:text="'SAVE ' + ${product.discountPercentage} + '%'">SAVE 20%</span>
        </div>

        <p style="font-size: 1.05rem; color: var(--color-slate-600); line-height: 1.7; margin-bottom: 2rem;" th:text="${product.description}">
          Full product description goes here...
        </p>

        <!-- Add to Cart Form -->
        <form th:action="@{/cart/add}" method="post" style="display: flex; gap: 1rem; align-items: center; margin-bottom: 2.5rem;">
          <input type="hidden" name="productId" th:value="${product.productId}">
          
          <div class="qty-control">
            <button type="button" class="qty-btn qty-minus">-</button>
            <input type="number" name="quantity" value="1" min="1" th:max="${product.stockQuantity}" class="qty-input">
            <button type="button" class="qty-btn qty-plus">+</button>
          </div>

          <button type="submit" class="btn btn-lg btn-primary" style="flex: 1;">
            <i class="fa-solid fa-cart-plus"></i> Add to Cart
          </button>
        </form>

        <!-- Features list -->
        <div style="border-top: 1px solid var(--color-slate-200); padding-top: 1.5rem; display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; font-size: 0.9rem;">
          <div><i class="fa-solid fa-check" style="color: var(--color-accent);"></i> Lifetime Warranty</div>
          <div><i class="fa-solid fa-check" style="color: var(--color-accent);"></i> Free Shipping Over $100</div>
          <div><i class="fa-solid fa-check" style="color: var(--color-accent);"></i> Weatherproof Ballistic Fabric</div>
          <div><i class="fa-solid fa-check" style="color: var(--color-accent);"></i> 30-Day Easy Returns</div>
        </div>
      </div>
    </div>

    <!-- Related Products -->
    <div th:if="${relatedProducts != null and !relatedProducts.isEmpty()}" style="margin-top: 5rem;">
      <h2 class="section-title" style="margin-bottom: 2rem;">You Might Also Like</h2>
      <div class="product-grid">
        <div th:each="prod : ${relatedProducts}" class="product-card">
          <div class="product-thumb">
            <img th:src="${prod.imageUrl}" th:alt="${prod.name}">
          </div>
          <div class="product-details">
            <a th:href="@{/products/{id}(id=${prod.productId})}">
              <h3 class="product-title" th:text="${prod.name}">Product Title</h3>
            </a>
            <div class="product-bottom">
              <div class="price-box">
                <span class="price-current" th:text="'$' + ${#numbers.formatDecimal(prod.effectivePrice, 1, 2)}">$99.99</span>
              </div>
              <a th:href="@{/products/{id}(id=${prod.productId})}" class="btn btn-sm btn-outline">View</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <div th:replace="~{fragments/footer :: footer}"></div>

  <script th:src="@{/js/main.js}"></script>
</body>
</html>
