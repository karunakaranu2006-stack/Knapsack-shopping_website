<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Orders - Knapsack</title>
  <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>

  <!-- Navbar -->
  <div th:replace="~{fragments/navbar :: navbar}"></div>

  <div class="container" style="padding-top: 3rem; padding-bottom: 5rem;">
    <h1 style="font-size: 2.25rem; font-weight: 800; margin-bottom: 2rem;">Order History</h1>

    <div th:if="${orders.isEmpty()}" style="background-color: white; border-radius: var(--radius-2xl); padding: 4rem; text-align: center; border: 1px solid var(--color-slate-200);">
      <i class="fa-solid fa-box-open" style="font-size: 3.5rem; color: var(--color-slate-300); margin-bottom: 1.5rem;"></i>
      <h2>No orders yet</h2>
      <p style="color: var(--color-slate-500); margin-bottom: 2rem;">When you place orders, they will show up here.</p>
      <a th:href="@{/products}" class="btn btn-lg btn-primary">Browse Shop</a>
    </div>

    <div th:unless="${orders.isEmpty()}" style="display: flex; flex-direction: column; gap: 1.5rem;">
      <div th:each="order : ${orders}" style="background-color: white; border-radius: var(--radius-xl); padding: 1.5rem 2rem; border: 1px solid var(--color-slate-200); box-shadow: var(--shadow-sm); display: flex; justify-content: space-between; align-items: center;">
        <div>
          <div style="font-weight: 700; font-size: 1.1rem; color: var(--color-slate-900);" th:text="${order.orderNumber}">KNS-12345</div>
          <div style="font-size: 0.85rem; color: var(--color-slate-500); margin-top: 0.25rem;">
            Placed on <span th:text="${#temporals.format(order.createdAt, 'MMM dd, yyyy HH:mm')}">Date</span> &bull; <span th:text="${order.orderItems.size()} + ' items'">1 item</span>
          </div>
        </div>

        <div style="display: flex; align-items: center; gap: 2rem;">
          <span class="status-pill" th:classappend="'status-' + ${#strings.toLowerCase(order.orderStatus)}" th:text="${order.orderStatus}">PENDING</span>
          <div style="font-size: 1.25rem; font-weight: 800;" th:text="'₹' + ${#numbers.formatDecimal(order.finalAmount, 1, 2)}">₹9,999</div>
          <a th:href="@{/orders/{id}(id=${order.orderId})}" class="btn btn-outline btn-sm">View Details</a>
        </div>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <div th:replace="~{fragments/footer :: footer}"></div>

  <script th:src="@{/js/main.js}"></script>
</body>
</html>
