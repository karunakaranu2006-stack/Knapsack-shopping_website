<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account - Knapsack</title>
  <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body style="background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%); min-height: 100vh; display: flex; flex-direction: column;">

  <!-- Navbar -->
  <div th:replace="~{fragments/navbar :: navbar}"></div>

  <div class="container" style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 3rem 1rem;">
    <div class="form-card" style="width: 100%;">
      <div style="text-align: center; margin-bottom: 2rem;">
        <div class="brand-icon" style="margin: 0 auto 1rem auto; width: 3.5rem; height: 3.5rem; font-size: 1.75rem;">
          <i class="fa-solid fa-user-plus"></i>
        </div>
        <h1 style="font-size: 1.75rem; font-weight: 800;">Create Your Account</h1>
        <p style="color: var(--color-slate-500); font-size: 0.9rem; margin-top: 0.25rem;">Join Knapsack for exclusive drops & perks</p>
      </div>

      <div th:if="${errorMessage}" class="alert-danger" th:text="${errorMessage}">Error message</div>

      <form th:action="@{/register}" method="post">
        <div class="form-group">
          <label class="form-label">Full Name</label>
          <input type="text" name="fullName" th:value="${fullName}" required placeholder="John Doe" class="form-input">
        </div>

        <div class="form-group">
          <label class="form-label">Email Address</label>
          <input type="email" name="email" th:value="${email}" required placeholder="you@example.com" class="form-input">
        </div>

        <div class="form-group">
          <label class="form-label">Phone Number</label>
          <input type="tel" name="phone" th:value="${phone}" placeholder="+1 (555) 000-0000" class="form-input">
        </div>

        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" name="password" required placeholder="••••••••" class="form-input">
        </div>

        <div class="form-group">
          <label class="form-label">Confirm Password</label>
          <input type="password" name="confirmPassword" required placeholder="••••••••" class="form-input">
        </div>

        <button type="submit" class="btn btn-primary btn-lg" style="width: 100%; margin-top: 1rem;">
          Register Account
        </button>
      </form>

      <div style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: var(--color-slate-500);">
        Already have an account? <a th:href="@{/login}" style="color: var(--color-primary); font-weight: 700;">Sign In</a>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
