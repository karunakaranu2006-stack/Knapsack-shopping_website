<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Details - Knapsack</title>
  <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>

  <!-- Navbar -->
  <div th:replace="~{fragments/navbar :: navbar}"></div>

  <div class="container" style="padding-top: 3rem; padding-bottom: 5rem; max-width: 900px;">
    <div style="margin-bottom: 2rem;">
      <a th:href="@{/orders}" style="color: var(--color-slate-500); font-weight: 600;"><i class="fa-solid fa-arrow-left"></i> Back to Orders</a>
      <h1 style="font-size: 2.25rem; font-weight: 800; margin-top: 0.5rem;" th:text="'Order #' + ${order.orderNumber}">Order Details</h1>
    </div>

    <!-- Status Tracking Bar -->
    <div style="background-color: white; border-radius: var(--radius-2xl); padding: 2rem; border: 1px solid var(--color-slate-200); box-shadow: var(--shadow-sm); margin-bottom: 2.5rem;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
        <div>
          <span style="font-weight: 700;">Order Status:</span>
          <span class="status-pill" th:classappend="'status-' + ${#strings.toLowerCase(order.orderStatus)}" th:text="${order.orderStatus}">PLACED</span>
        </div>
        
        <div th:if="${order.orderStatus == 'PLACED' or order.orderStatus == 'PROCESSING'}">
          <a th:href="@{/orders/cancel/{id}(id=${order.orderId})}" class="btn btn-sm btn-outline" style="color: var(--color-danger); border-color: #fecaca;" onclick="return confirm('Are you sure you want to cancel this order?');">
            <i class="fa-solid fa-ban"></i> Cancel Order
          </a>
        </div>
      </div>

      <!-- Step Timeline Visualizer -->
      <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 1rem; text-align: center; font-size: 0.85rem; font-weight: 700;">
        <div style="padding: 0.75rem; border-radius: var(--radius-lg);" th:styleappend="${order.orderStatus == 'PLACED' or order.orderStatus == 'PROCESSING' or order.orderStatus == 'SHIPPED' or order.orderStatus == 'DELIVERED' ? 'background-color: #e0e7ff; color: var(--color-primary);' : 'background-color: var(--color-slate-100); color: var(--color-slate-400);'}">
          1. PLACED
        </div>
        <div style="padding: 0.75rem; border-radius: var(--radius-lg);" th:styleappend="${order.orderStatus == 'PROCESSING' or order.orderStatus == 'SHIPPED' or order.orderStatus == 'DELIVERED' ? 'background-color: #e0f2fe; color: #0284c7;' : 'background-color: var(--color-slate-100); color: var(--color-slate-400);'}">
          2. PROCESSING
        </div>
        <div style="padding: 0.75rem; border-radius: var(--radius-lg);" th:styleappend="${order.orderStatus == 'SHIPPED' or order.orderStatus == 'DELIVERED' ? 'background-color: #e0e7ff; color: #4338ca;' : 'background-color: var(--color-slate-100); color: var(--color-slate-400);'}">
          3. SHIPPED
        </div>
        <div style="padding: 0.75rem; border-radius: var(--radius-lg);" th:styleappend="${order.orderStatus == 'DELIVERED' ? 'background-color: #d1fae5; color: #059669;' : 'background-color: var(--color-slate-100); color: var(--color-slate-400);'}">
          4. DELIVERED
        </div>
      </div>
    </div>

    <!-- Items Table Card -->
    <div style="background-color: white; border-radius: var(--radius-2xl); padding: 2.5rem; border: 1px solid var(--color-slate-200); box-shadow: var(--shadow-sm);">
      <h2 style="font-size: 1.5rem; font-weight: 700; margin-bottom: 1.5rem;">Purchased Items</h2>

      <table class="cart-table" style="margin-bottom: 2rem;">
        <thead>
          <tr>
            <th>Product</th>
            <th>Qty</th>
            <th>Unit Price</th>
            <th>Subtotal</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="item : ${order.orderItems}">
            <td>
              <div class="cart-item-info">
                <img th:src="${item.product.imageUrl}" class="cart-item-img">
                <a th:href="@{/products/{id}(id=${item.product.productId})}" style="font-weight: 700; color: var(--color-slate-900);" th:text="${item.product.name}">Product</a>
              </div>
            </td>
            <td th:text="${item.quantity}">1</td>
            <td th:text="'₹' + ${#numbers.formatDecimal(item.priceAtPurchase, 1, 2)}">₹9,999</td>
            <td style="font-weight: 700;" th:text="'₹' + ${#numbers.formatDecimal(item.subtotal, 1, 2)}">₹9,999</td>
          </tr>
        </tbody>
      </table>

      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; border-top: 1px solid var(--color-slate-200); padding-top: 1.5rem;">
        <div>
          <h4 style="font-weight: 700; margin-bottom: 0.5rem;">Shipping Address</h4>
          <p style="color: var(--color-slate-600);" th:text="${order.shippingAddress}">Address</p>
        </div>
        <div style="text-align: right;">
          <div style="font-size: 0.95rem; color: var(--color-slate-600);">Total: <span th:text="'₹' + ${#numbers.formatDecimal(order.totalAmount, 1, 2)}">₹0.00</span></div>
          <div th:if="${order.discountAmount > 0}" style="font-size: 0.95rem; color: var(--color-secondary);">Discount: <span th:text="'-₹' + ${#numbers.formatDecimal(order.discountAmount, 1, 2)}">-₹500.00</span></div>
          <div style="font-size: 2rem; font-weight: 800; color: var(--color-slate-900);" th:text="'₹' + ${#numbers.formatDecimal(order.finalAmount, 1, 2)}">₹0.00</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <div th:replace="~{fragments/footer :: footer}"></div>

  <script th:src="@{/js/main.js}"></script>
</body>
</html>
