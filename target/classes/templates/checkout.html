<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout - Knapsack</title>
  <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>

  <!-- Navbar -->
  <div th:replace="~{fragments/navbar :: navbar}"></div>

  <div class="container" style="padding-top: 3rem; padding-bottom: 5rem;">
    <h1 style="font-size: 2.25rem; font-weight: 800; margin-bottom: 2rem;">Checkout & Shipping</h1>

    <form th:action="@{/checkout/place-order}" method="post" style="display: grid; grid-template-columns: 1fr 380px; gap: 3rem; align-items: start;">
      <!-- Shipping Form -->
      <div style="background-color: white; border-radius: var(--radius-2xl); padding: 2rem; border: 1px solid var(--color-slate-200); box-shadow: var(--shadow-sm);">
        <h2 style="font-size: 1.5rem; font-weight: 700; margin-bottom: 1.5rem;"><i class="fa-solid fa-truck" style="color: var(--color-primary);"></i> Shipping Address</h2>

        <div class="form-group">
          <label class="form-label">Full Name</label>
          <input type="text" th:value="${currentUser.fullName}" class="form-input" readonly style="background-color: var(--color-slate-100);">
        </div>

        <div class="form-group">
          <label class="form-label">Street Address *</label>
          <input type="text" name="shippingAddress" required placeholder="123 Innovation Way, Suite 400" class="form-input">
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
          <div class="form-group">
            <label class="form-label">City *</label>
            <input type="text" name="city" required placeholder="San Francisco" class="form-input">
          </div>
          <div class="form-group">
            <label class="form-label">Postal / ZIP Code *</label>
            <input type="text" name="postalCode" required placeholder="94107" class="form-input">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Phone Number *</label>
          <input type="tel" name="phone" th:value="${currentUser.phone}" required placeholder="+1 (555) 000-0000" class="form-input">
        </div>

        <h2 style="font-size: 1.5rem; font-weight: 700; margin-top: 2.5rem; margin-bottom: 1.5rem;"><i class="fa-solid fa-credit-card" style="color: var(--color-primary);"></i> Payment Method</h2>

        <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; margin-bottom: 1.5rem;">
          <label style="border: 2px solid var(--color-primary); padding: 1rem; border-radius: var(--radius-xl); text-align: center; cursor: pointer; background-color: var(--color-primary-light);">
            <input type="radio" name="paymentMethod" value="CREDIT_CARD" checked style="display: none;">
            <i class="fa-solid fa-credit-card" style="font-size: 1.5rem; color: var(--color-primary); margin-bottom: 0.5rem; display: block;"></i>
            <span style="font-weight: 700; font-size: 0.85rem;">Credit Card</span>
          </label>
          <label style="border: 1px solid var(--color-slate-300); padding: 1rem; border-radius: var(--radius-xl); text-align: center; cursor: pointer;">
            <input type="radio" name="paymentMethod" value="PAYPAL" style="display: none;">
            <i class="fa-brands fa-paypal" style="font-size: 1.5rem; color: #003087; margin-bottom: 0.5rem; display: block;"></i>
            <span style="font-weight: 700; font-size: 0.85rem;">PayPal</span>
          </label>
          <label style="border: 1px solid var(--color-slate-300); padding: 1rem; border-radius: var(--radius-xl); text-align: center; cursor: pointer;">
            <input type="radio" name="paymentMethod" value="CASH_ON_DELIVERY" style="display: none;">
            <i class="fa-solid fa-money-bill-wave" style="font-size: 1.5rem; color: var(--color-accent); margin-bottom: 0.5rem; display: block;"></i>
            <span style="font-weight: 700; font-size: 0.85rem;">Pay on Delivery</span>
          </label>
        </div>
      </div>

      <!-- Order Review Sidebar -->
      <div class="summary-card">
        <h3 style="font-size: 1.25rem; font-weight: 700; margin-bottom: 1.25rem;">Items in Order (<span th:text="${cartItems.size()}">0</span>)</h3>

        <div style="max-height: 240px; overflow-y: auto; margin-bottom: 1.5rem; border-bottom: 1px solid var(--color-slate-200); padding-bottom: 1rem;">
          <div th:each="item : ${cartItems}" style="display: flex; gap: 0.75rem; align-items: center; margin-bottom: 0.75rem;">
            <img th:src="${item.product.imageUrl}" style="width: 3.5rem; height: 3.5rem; border-radius: var(--radius-md); object-fit: cover;">
            <div style="flex: 1;">
              <div style="font-weight: 600; font-size: 0.9rem;" th:text="${item.product.name}">Product Name</div>
              <div style="font-size: 0.8rem; color: var(--color-slate-500);" th:text="${item.quantity} + ' x $' + ${#numbers.formatDecimal(item.product.effectivePrice, 1, 2)}">1 x $99.99</div>
            </div>
            <div style="font-weight: 700;" th:text="'$' + ${#numbers.formatDecimal(item.subtotal, 1, 2)}">$99.99</div>
          </div>
        </div>

        <div class="summary-row">
          <span>Subtotal</span>
          <span th:text="'$' + ${#numbers.formatDecimal(subtotal, 1, 2)}">$0.00</span>
        </div>
        <div class="summary-row">
          <span>Shipping</span>
          <span th:text="${shipping == 0.0 ? 'FREE' : '$' + #numbers.formatDecimal(shipping, 1, 2)}">$0.00</span>
        </div>
        <div class="summary-row">
          <span>Tax</span>
          <span th:text="'$' + ${#numbers.formatDecimal(tax, 1, 2)}">$0.00</span>
        </div>

        <div class="summary-row total">
          <span>Total</span>
          <span th:text="'$' + ${#numbers.formatDecimal(grandTotal, 1, 2)}">$0.00</span>
        </div>

        <button type="submit" class="btn btn-primary btn-lg" style="width: 100%; margin-top: 1.5rem;">
          <i class="fa-solid fa-lock"></i> Complete Order
        </button>
      </div>
    </form>
  </div>

  <!-- Footer -->
  <div th:replace="~{fragments/footer :: footer}"></div>

  <script th:src="@{/js/main.js}"></script>
</body>
</html>
