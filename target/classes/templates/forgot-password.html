<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password - Knapsack</title>
  <link rel="stylesheet" th:href="@{/css/main.css}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body style="background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%); min-height: 100vh; display: flex; flex-direction: column;">

  <!-- Navbar -->
  <div th:replace="~{fragments/navbar :: navbar}"></div>

  <div class="container" style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 3rem 1rem;">
    <div class="form-card" style="width: 100%; max-width: 440px;">
      <div style="text-align: center; margin-bottom: 2rem;">
        <div class="brand-icon" style="margin: 0 auto 1rem auto; width: 3.5rem; height: 3.5rem; font-size: 1.75rem;">
          <i class="fa-solid fa-key"></i>
        </div>
        <h1 style="font-size: 1.75rem; font-weight: 800; color: var(--color-slate-900);">Reset Password</h1>
        <p style="color: var(--color-slate-500); font-size: 0.9rem; margin-top: 0.25rem;">Enter your email to receive password reset instructions</p>
      </div>

      <div th:if="${errorMessage}" class="alert-danger" th:text="${errorMessage}">Error message</div>
      <div th:if="${successMessage}" class="alert-success" th:text="${successMessage}">Success message</div>

      <form th:action="@{/forgot-password}" method="post">
        <div class="form-group">
          <label class="form-label">Email Address</label>
          <input type="email" name="email" required placeholder="you@example.com" class="form-input">
        </div>

        <button type="submit" class="btn btn-primary btn-lg" style="width: 100%; margin-top: 1rem;">
          Send Reset Instructions
        </button>
      </form>

      <div style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: var(--color-slate-500);">
        Remembered your password? <a th:href="@{/login}" style="color: var(--color-primary); font-weight: 700;">Back to Sign In</a>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
