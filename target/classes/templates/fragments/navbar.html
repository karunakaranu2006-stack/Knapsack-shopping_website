<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head></head>
<body>
<nav th:fragment="navbar" class="navbar">
  <div class="container navbar-inner">
    <a th:href="@{/}" class="brand-logo">
      <div class="brand-icon">
        <i class="fa-solid fa-bag-shopping"></i>
      </div>
      <span>Knapsack</span>
    </a>

    <form th:action="@{/products}" method="get" class="search-bar">
      <i class="fa-solid fa-magnifying-glass search-icon"></i>
      <input type="text" name="keyword" th:value="${keyword}" class="search-input" placeholder="Search gear, gadgets, apparel...">
    </form>

    <ul class="nav-links">
      <li><a th:href="@{/}" class="nav-link">Home</a></li>
      <li><a th:href="@{/products}" class="nav-link">Shop Catalog</a></li>
      <li><a th:href="@{/about}" class="nav-link">About Us</a></li>

      <li th:if="${currentUser != null and currentUser.role == 'ADMIN'}">
        <a th:href="@{/admin}" class="btn btn-sm btn-outline" style="border-color: var(--color-secondary); color: var(--color-secondary);">
          <i class="fa-solid fa-gauge"></i> Admin Suite
        </a>
      </li>

      <li th:if="${currentUser != null}">
        <a th:href="@{/wishlist}" class="cart-btn" title="Wishlist" style="margin-right: -0.5rem;">
          <i class="fa-solid fa-heart" style="color: #ec4899;"></i>
          <span class="cart-badge" th:text="${wishlistCount != null ? wishlistCount : 0}" style="background-color: #ec4899;">0</span>
        </a>
      </li>

      <li th:if="${currentUser != null}">
        <a th:href="@{/orders}" class="nav-link" title="My Orders">
          <i class="fa-solid fa-box"></i> Orders
        </a>
      </li>

      <li th:if="${currentUser == null}">
        <a th:href="@{/login}" class="btn btn-sm btn-outline">Sign In</a>
      </li>

      <li th:if="${currentUser != null}">
        <div style="display: flex; align-items: center; gap: 0.75rem;">
          <a th:href="@{/profile}" style="font-weight: 700; font-size: 0.9rem; color: var(--color-slate-900);" th:text="${currentUser.fullName}">User</a>
          <a th:href="@{/logout}" class="nav-link" style="color: var(--color-danger);" title="Log out">
            <i class="fa-solid fa-arrow-right-from-bracket"></i>
          </a>
        </div>
      </li>

      <li>
        <a th:href="@{/cart}" class="cart-btn" aria-label="Cart">
          <i class="fa-solid fa-cart-shopping"></i>
          <span class="cart-badge" th:text="${cartCount != null ? cartCount : 0}">0</span>
        </a>
      </li>
    </ul>
  </div>
</nav>
</body>
</html>
